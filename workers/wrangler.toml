name = "kuchuang-yide"
compatibility_date = "2026-09-01"
main = "src/index.js"
# 全站静态资产（官网4页 + admin 后台）——Workers 静态托管，同域零 CORS
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]   # API 走 Worker，其余走静态

[[vectorize]]
binding = "KB"
index_name = "kcyd-kb"

[[kv_namespaces]]
binding = "COUNTERS"
id = "fbe64aca86684f5bb81c13519ccf01e8"

[[d1_databases]]
binding = "DB"
database_name = "kcyd-kb"
database_id = "e5fe283d-047d-4947-a1cc-d1cb540ef7df"

# [[r2_buckets]]
# binding = "MEDIA"                  # 后台上传的图片/视频（待控制台开通 R2 后取消注释）

# 原子 IP 限流（chat）：3次/60秒/IP；period 枚举仅 10/60；本地 dev 由 ratelimit.js 兜底
[[unsafe.bindings]]
name = "CHAT_RL"
type = "ratelimit"
namespace_id = "1001"
[unsafe.bindings.simple]
limit = 3     # 3 次/60秒/IP（=180/小时）；RL binding period 仅支持 10 或 60
period = 60

[vars]
ZHIPU_BASE = "https://open.bigmodel.cn/api/paas/v4"
CHAT_MODEL = "glm-4.6"
FILTER_MODEL = "glm-4.5-air"
EMBED_MODEL = "embedding-3"
KB_THRESHOLD = "0.42"      # 初值，黄金集校准后覆盖（docs/ai-guide-implementation.md §6）
TOP_K = "5"
DAILY_CHAT_CAP = "5000"
GATE_ENABLED = "true"      # 黄金集命中率≥80% 才放行 AI；false=强制全兜底（上线前开关）
OSS_BUCKET = "kuchuang-yide"     # 阿里云 OSS 独立桶（新加坡，海外访问友好，桶公共读）
OSS_REGION = "oss-ap-southeast-1"

# secrets（wrangler secret put）：
# ZHIPU_API_KEY / FEISHU_WEBHOOK / TURNSTILE_SECRET / ADMIN_PASSWORD

[observability]
enabled = true
